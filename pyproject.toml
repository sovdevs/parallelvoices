[project]
name = "parallel-voices"
version = "0.1.0"
description = "Public site: SPA + catalog search + offer endpoint"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false  # an app, not a library: nothing to build or install, just dependencies
